# 이미지 대조 배치 — CJ더마켓 ↔ GS샵 썸네일·상세 수집 → 해시 게이트 → AI 판정(Claude Code 구독).
# 설계: _workspace/01_design_image_match.md / 스크립트: scripts/match/run.ts
#
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL_UNPOOLED     Supabase Session Pooler(5432) 연결 문자열
#   CLAUDE_CODE_OAUTH_TOKEN   로컬에서 `claude setup-token` 으로 발급한 Max 구독 토큰
#   MATCH_PROXY_KEY           GS 중계 API 키 (Vercel 환경변수 MATCH_PROXY_KEY 와 같은 값)
#
# GS샵은 해외 IP(Actions 러너)에 오류 페이지를 준다 → GS 페이지만 Vercel 서울 리전 중계
# (src/app/api/match/gs-page) 를 거쳐 받는다.
#
# 공개 저장소라 실행 로그가 공개된다 — 스크립트는 자재코드·건수·판정 요약만 출력한다.
# 트리거는 schedule / workflow_dispatch 만 쓴다(포크 PR 에 비밀값이 넘어가지 않게).

name: image-match

on:
  schedule:
    # 매일 03:00 KST (= 18:00 UTC). GitHub 예약 실행은 수십 분 늦어질 수 있다.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '특정 자재코드만 (쉼표 구분, 비우면 전체)'
        required: false
        default: ''
      full:
        description: '상세 이미지 캐시 없이 전부 다시 받기'
        type: boolean
        default: false
      judge:
        description: 'AI 판정 실행'
        type: boolean
        default: true
      judge_limit:
        description: '1회 판정 상한 (쌍)'
        required: false
        default: '30'

# 같은 배치가 겹쳐 돌지 않게 (상태 전이가 꼬인다).
concurrency:
  group: image-match
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Claude Code 설치
        # 로컬 검증 버전에 고정. 올릴 때는 로컬에서 판정 1쌍을 먼저 확인한다.
        run: npm install -g @anthropic-ai/claude-code@2.1.308

      - name: 배치 실행
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_BIN: claude
          MATCH_GS_PROXY_URL: https://jkm-dashboard.vercel.app/api/match/gs-page
          MATCH_PROXY_KEY: ${{ secrets.MATCH_PROXY_KEY }}
          ONLY: ${{ inputs.only }}
          FULL: ${{ inputs.full }}
          JUDGE: ${{ inputs.judge }}
          JUDGE_LIMIT: ${{ inputs.judge_limit }}
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FULL" = "true" ] && args+=(--full)
          [ "$JUDGE" = "false" ] && args+=(--no-judge)
          [ -n "$JUDGE_LIMIT" ] && args+=(--judge-limit "$JUDGE_LIMIT")
          pnpm tsx scripts/match/run.ts "${args[@]}"
